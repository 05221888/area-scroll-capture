<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在截长图…</title>
<style>
  :root{
    --brand:#2563eb; --ink:#111827; --ink2:#6b7280; --ink3:#9ca3af;
    --line:#e5e7eb; --ok:#059669; --err:#dc2626;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased;
  }
  #wrap{
    display:flex; flex-direction:column; justify-content:center;
    height:100%; padding:18px 20px;
  }

  /* 顶部：图标 + 标题 */
  #head{ display:flex; align-items:center; gap:10px; }
  #ic{
    width:26px; height:26px; flex:none; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    background:#eff6ff; color:var(--brand);
  }
  #ic svg{ width:15px; height:15px; }
  #t{ font-size:13.5px; font-weight:650; letter-spacing:-.01em; }

  /* 进度条 */
  #bar{
    margin-top:14px; height:5px; border-radius:3px;
    background:var(--line); overflow:hidden;
  }
  #bar > i{
    display:block; height:100%; width:0; border-radius:3px;
    background:var(--brand); transition:width .16s ease-out;
  }
  #s{
    margin-top:9px; font-size:11.5px; color:var(--ink2);
    font-variant-numeric:tabular-nums;
  }

  /* 错误详情 */
  #e{
    display:none; margin-top:11px; padding:9px 10px;
    background:#fef2f2; border:1px solid #fecaca; border-radius:7px;
    color:var(--err); font-size:11px; line-height:1.5; word-break:break-word;
    max-height:78px; overflow:auto;
  }

  /* 状态色 */
  body.ok #ic{ background:#ecfdf5; color:var(--ok); }
  body.ok #bar > i{ background:var(--ok); }
  body.ok #s{ color:var(--ok); font-weight:550; }
  body.bad #ic{ background:#fef2f2; color:var(--err); }
  body.bad #bar > i{ background:var(--err); }
  body.bad #t{ color:var(--err); }

  /* 图标按状态切换显隐 */
  #ic svg{ display:none; }
  body.busy #ic .i-busy,
  body.ok   #ic .i-ok,
  body.bad  #ic .i-bad{ display:block; }

  /* 转圈（准备阶段） */
  @keyframes spin{ to{ transform:rotate(360deg); } }
  body.busy #ic .i-busy{ animation:spin .9s linear infinite; }
</style>
</head>
<body class="busy">
  <div id="wrap">
    <div id="head">
      <div id="ic">
        <svg class="i-busy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/>
        </svg>
        <svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <svg class="i-bad" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </div>
      <div id="t">正在截长图…</div>
    </div>
    <div id="bar"><i></i></div>
    <div id="s">准备中…</div>
    <div id="e"></div>
  </div>
  <script src="store.js"></script>
  <script src="capture.js"></script>
</body>
</html>
