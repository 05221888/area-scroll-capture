<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在截长图…</title>
<style>
  html,body { margin:0; height:100%; font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
              background:#1b6fe0; color:#fff; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:14px; box-sizing:border-box; text-align:center; }
  #t { font-size:14px; font-weight:600; margin-bottom:10px; }
  #bar { width:100%; height:8px; background:rgba(255,255,255,.28); border-radius:4px; overflow:hidden; }
  #bar > i { display:block; height:100%; width:0; background:#fff; transition:width .15s; }
  #s { margin-top:9px; font-size:12px; opacity:.9; }
  #e { margin-top:9px; font-size:12px; line-height:1.5; display:none; background:rgba(0,0,0,.28);
       padding:8px; border-radius:6px; word-break:break-all; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="t">正在截长图…</div>
    <div id="bar"><i></i></div>
    <div id="s">准备中…</div>
    <div id="e"></div>
  </div>
  <script src="capture.js"></script>
</body>
</html>
