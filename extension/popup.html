<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --brand:#2563eb; --brand-dark:#1d4ed8; --brand-weak:#eff4ff;
    --ink:#111827; --ink2:#6b7280; --ink3:#9ca3af;
    --line:#e5e7eb; --bg:#ffffff; --soft:#f9fafb;
    --ok:#059669; --err:#dc2626;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; width:340px; color:var(--ink);
    font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg); -webkit-font-smoothing:antialiased;
  }

  /* ── 顶部 ── */
  .hd{ padding:14px 16px 12px; }
  .hd h1{ margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .hd p{ margin:3px 0 0; font-size:11.5px; color:var(--ink2); }

  /* ── 两张卡 ── */
  .bd{ padding:0 16px 14px; }
  .choose{ display:flex; gap:10px; }
  .card{
    flex:1; position:relative; padding:14px 11px 13px;
    border:1.5px solid var(--line); border-radius:11px; background:#fff;
    cursor:pointer; text-align:center; user-select:none;
    transition:border-color .16s, background .16s, box-shadow .16s, transform .1s;
  }
  .card:hover{ border-color:var(--brand); background:var(--brand-weak); box-shadow:0 2px 10px rgba(37,99,235,.10); }
  .card:active{ transform:scale(.985); }
  .card:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .card .ico{ display:block; margin:0 auto 8px; width:30px; height:30px; color:var(--brand); }
  .card .ico svg{ display:block; width:100%; height:100%; }
  .card .ttl{ font-weight:650; font-size:13px; letter-spacing:-.01em; }
  .card .sub{ color:var(--ink2); font-size:11px; margin-top:4px; line-height:1.45; }
  .card .badge{
    position:absolute; top:-8px; right:8px; padding:1px 6px; border-radius:20px;
    background:var(--brand); color:#fff; font-size:9.5px; font-weight:600; letter-spacing:.02em;
  }

  /* ── 提示区 ── */
  .tip{
    margin:12px 0 0; padding:9px 11px; border-radius:8px;
    background:var(--brand-weak); color:var(--brand-dark); font-size:11.5px; line-height:1.5;
  }
  .tip b{ font-weight:650; }
  .info{
    display:none; margin:9px 0 0; padding:9px 11px; border-radius:8px;
    background:var(--soft); border:1px solid var(--line);
    font-size:11.5px; color:var(--ink2); word-break:break-all;
  }
  .info b{ color:var(--brand-dark); font-weight:650; }

  /* ── 分隔 + 设置 ── */
  .sep{ height:1px; background:var(--line); margin:14px 0 12px; }
  .setlab{
    display:flex; align-items:center; justify-content:space-between;
    font-size:10.5px; font-weight:600; color:var(--ink3);
    letter-spacing:.05em; text-transform:uppercase; margin-bottom:9px;
  }
  .row{ display:flex; align-items:center; gap:9px; margin:9px 0; font-size:12px; }
  .row label{ width:62px; color:var(--ink2); flex:none; }
  .row .val{
    width:52px; flex:none; text-align:right; font-variant-numeric:tabular-nums;
    color:var(--ink); font-size:11.5px; font-weight:550;
  }
  .row.chk{ margin-top:11px; }
  .row.chk label{
    width:auto; color:var(--ink2); font-size:11.5px;
    display:flex; align-items:center; gap:7px; cursor:pointer;
  }
  .row.chk input{ margin:0; accent-color:var(--brand); }

  /* 滑杆 */
  input[type=range]{
    flex:1; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:2px; outline:none; cursor:pointer;
    background:var(--line);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--brand); cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.14); transition:transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.12); }

  /* 下拉 */
  select{
    flex:1; padding:6px 9px; border:1.5px solid var(--line); border-radius:7px;
    background:#fff; color:var(--ink); font-size:12px; cursor:pointer;
    font-family:inherit; outline:none; transition:border-color .15s;
  }
  select:hover{ border-color:#cbd5e1; }
  select:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.10); }

  /* ── 按钮 / 结果 ── */
  .btn{
    width:100%; padding:9px; margin-top:10px;
    border:0; border-radius:8px; font-size:12.5px; font-weight:600;
    font-family:inherit; cursor:pointer;
    background:var(--brand); color:#fff; transition:background .15s;
  }
  .btn:hover{ background:var(--brand-dark); }
  .res{
    display:none; margin-top:10px; padding:9px 11px; border-radius:8px;
    font-size:11.5px; line-height:1.5; word-break:break-all;
  }
  .res.err{ background:#fef2f2; color:var(--err); border:1px solid #fecaca; }

  /* ── 页脚 ── */
  .foot{
    padding:10px 16px 12px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--ink3); line-height:1.5;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>
  <div class="hd">
    <h1>长截图</h1>
    <p>点一下，弹进度窗，截完自动下载</p>
  </div>

  <div class="bd">
    <div id="choose" class="choose">
      <div id="cardFull" class="card" tabindex="0" role="button">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="3.5" width="19" height="12" rx="1.6"/>
            <path d="M12 15.5v5M8.5 17l3.5 3.5 3.5-3.5"/>
            <path d="M6 7.5h5M6 10.5h9"/>
          </svg>
        </span>
        <div class="ttl">全屏长截图</div>
        <div class="sub">整个网页<br>从上到下</div>
      </div>

      <div id="cardRegion" class="card" tabindex="0" role="button">
        <span class="badge">独有</span>
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="19" height="16" rx="1.6"/>
            <rect x="7.5" y="8" width="9" height="8" rx="1" stroke-dasharray="2.4 2.2"/>
            <path d="M4.4 4v2.2M19.6 4v2.2M2.5 4h2.2M19.3 4h2.2"/>
          </svg>
        </span>
        <div class="ttl">区域截图</div>
        <div class="sub">只截页面里<br>可滚动小窗口</div>
      </div>
    </div>

    <div id="stepPick" class="tip hidden">去页面点一下要截的小窗口，按 <b>Esc</b> 取消</div>
    <div id="info" class="info"></div>

    <div class="sep"></div>
    <div class="setlab"><span>参数</span></div>

    <div class="row">
      <label for="overlap">帧间重叠</label>
      <input id="overlap" type="range" min="0" max="200" step="2" value="16">
      <span id="overlapV" class="val">16px</span>
    </div>
    <div class="row">
      <label for="delay">渲染等待</label>
      <input id="delay" type="range" min="60" max="1200" step="30" value="120">
      <span id="delayV" class="val">120ms</span>
    </div>
    <div class="row">
      <label for="format">格式</label>
      <select id="format">
        <option value="png">PNG · 无损</option>
        <option value="jpeg">JPG · 体积小</option>
      </select>
    </div>
    <div class="row chk">
      <label><input id="saveAs" type="checkbox"> 每次询问保存位置</label>
    </div>

    <button id="redo" class="btn hidden">用当前设置重截一次</button>
    <div id="res" class="res"></div>
  </div>

  <div class="foot">采集期间请勿切换标签页</div>

  <script src="popup.js"></script>
</body>
</html>
